
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europa-Quiz 🌍</title>
<style>
:root {
  --bg: #f3f6ff;
  --card: #ffffff;
  --text: #192443;
  --accent: #4965e9;
  --muted: #68738e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  text-align: center;
  padding: 30px 16px 22px;
  background: linear-gradient(135deg,#3448bd,#7189ff);
  color: white;
}
header h1 { margin: 0 0 8px; font-size: 2rem; }
header p { margin: 0; }
main { max-width: 720px; margin: 22px auto; padding: 0 15px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.stat, .panel {
  background: var(--card);
  border-radius: 18px;
  padding: 17px;
  box-shadow: 0 4px 18px #263c7410;
}
.stat { text-align: center; }
.stat strong { display: block; font-size: 1.5rem; }
.stat span { color: var(--muted); font-size: .85rem; }
.modes {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 18px;
}
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 12px 10px;
  background: #e9edff;
  color: #3045b8;
  font-weight: 650;
}
button:focus-visible { outline: 3px solid #f0a928; }
button.active, button.primary {
  background: var(--accent);
  color: white;
}
button:disabled { cursor: default; opacity: .7; }
.panel { text-align: center; }
.kicker {
  color: var(--muted);
  font-size: .85rem;
  text-transform: uppercase;
  letter-spacing: .08em;
}
#clue { font-size: 1.3rem; font-weight: 700; margin: 12px 0; }
#flag { font-size: 5rem; line-height: 1.3; margin: 10px; }
#options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 22px;
}
.option {
  min-height: 58px;
  background: #f1f3fb;
  color: var(--text);
  border: 2px solid transparent;
}
.option:hover:not(:disabled) { border-color: var(--accent); }
.option.correct { background: #d9f7e6; border-color: #23965a; color: #12643a; }
.option.wrong { background: #ffe1e1; border-color: #d84d4d; color: #8e2222; }
#feedback { min-height: 30px; margin: 16px 0 8px; font-weight: 650; }
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.progress {
  height: 8px;
  background: #e7eaf5;
  border-radius: 99px;
  overflow: hidden;
  margin: 15px 0;
}
#bar { height: 100%; width: 0; background: #6478f1; transition: width .2s; }
.small { font-size: .88rem; color: var(--muted); }
footer { text-align: center; padding: 20px; color: var(--muted); }
@media(max-width:480px) {
  header h1 { font-size: 1.65rem; }
  .modes { grid-template-columns: 1fr; }
  #options { grid-template-columns: 1fr; }
  .stat { padding: 12px 5px; }
}
</style>
</head>
<body>
<header>
  <h1>🌍 Europa-Quiz</h1>
  <p>Kennst du Europas Länder, Hauptstädte und Flaggen?</p>
</header>

<main>
  <section class="stats">
    <div class="stat"><strong id="score">0</strong><span>Punkte</span></div>
    <div class="stat"><strong id="round">0</strong><span>Beantwortet</span></div>
    <div class="stat"><strong id="streak">0</strong><span>Richtige in Folge</span></div>
  </section>

  <nav class="modes" aria-label="Quizmodus">
    <button class="active" data-mode="capital">🏙️ Hauptstadt</button>
    <button data-mode="flag">🏳️ Flagge</button>
    <button data-mode="country">🌍 Land</button>
  </nav>

  <section class="panel">
    <div class="kicker" id="modeTitle">Hauptstadt gesucht</div>
    <div id="flag" aria-hidden="true"></div>
    <div id="clue">Welches Land hat diese Hauptstadt?</div>
    <div class="progress"><div id="bar"></div></div>
    <div id="options" aria-label="Antwortmöglichkeiten"></div>
    <div id="feedback" aria-live="polite"></div>
    <div class="actions">
      <button id="next" class="primary" hidden>Nächste Frage →</button>
      <button id="restart">↻ Neu starten</button>
    </div>
    <p class="small">Tipp: Versuche, vor dem Antworten selbst nachzudenken.</p>
  </section>
</main>
<footer>Made for curious minds · Europa entdecken 🇪🇺</footer>

<script>
const countries = [
["Albanien","Tirana","🇦🇱"],
["Andorra","Andorra la Vella","🇦🇩"],
["Belarus","Minsk","🇧🇾"],
["Belgien","Brüssel","🇧🇪"],
["Bosnien und Herzegowina","Sarajevo","🇧🇦"],
["Bulgarien","Sofia","🇧🇬"],
["Dänemark","Kopenhagen","🇩🇰"],
["Deutschland","Berlin","🇩🇪"],
["Estland","Tallinn","🇪🇪"],
["Finnland","Helsinki","🇫🇮"],
["Frankreich","Paris","🇫🇷"],
["Griechenland","Athen","🇬🇷"],
["Irland","Dublin","🇮🇪"],
["Island","Reykjavík","🇮🇸"],
["Italien","Rom","🇮🇹"],
["Kosovo","Pristina","🇽🇰"],
["Kroatien","Zagreb","🇭🇷"],
["Lettland","Riga","🇱🇻"],
["Liechtenstein","Vaduz","🇱🇮"],
["Litauen","Vilnius","🇱🇹"],
["Luxemburg","Luxemburg","🇱🇺"],
["Malta","Valletta","🇲🇹"],
["Moldau","Chișinău","🇲🇩"],
["Monaco","Monaco","🇲🇨"],
["Montenegro","Podgorica","🇲🇪"],
["Niederlande","Amsterdam","🇳🇱"],
["Nordmazedonien","Skopje","🇲🇰"],
["Norwegen","Oslo","🇳🇴"],
["Österreich","Wien","🇦🇹"],
["Polen","Warschau","🇵🇱"],
["Portugal","Lissabon","🇵🇹"],
["Rumänien","Bukarest","🇷🇴"],
["Russland","Moskau","🇷🇺"],
["San Marino","San Marino","🇸🇲"],
["Schweden","Stockholm","🇸🇪"],
["Schweiz","Bern","🇨🇭"],
["Serbien","Belgrad","🇷🇸"],
["Slowakei","Bratislava","🇸🇰"],
["Slowenien","Ljubljana","🇸🇮"],
["Spanien","Madrid","🇪🇸"],
["Tschechien","Prag","🇨🇿"],
["Türkei","Ankara","🇹🇷"],
["Ukraine","Kyjiw","🇺🇦"],
["Ungarn","Budapest","🇭🇺"],
["Vatikanstadt","Vatikanstadt","🇻🇦"],
["Vereinigtes Königreich","London","🇬🇧"],
["Zypern","Nikosia","🇨🇾"]
].map(([land, hauptstadt, flag]) => ({land, hauptstadt, flag}));

const $ = id => document.getElementById(id);
let mode = "capital";
let current = null;
let answered = false;
let score = 0;
let round = 0;
let streak = 0;
let bestStreak = 0;
let deck = [];
let deckIndex = 0;

const modeNames = {
  capital: "Hauptstadt gesucht",
  flag: "Land anhand der Flagge",
  country: "Land gesucht"
};

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function newDeck() {
  deck = shuffle(countries);
  deckIndex = 0;
}

function nextQuestion() {
  if (deckIndex >= deck.length) newDeck();
  current = deck[deckIndex++];
  answered = false;
  $("modeTitle").textContent = modeNames[mode];
  $("flag").textContent = mode === "flag" ? current.flag : "";
  $("clue").textContent = mode === "capital"
    ? "Welches Land hat diese Hauptstadt?"
    : mode === "flag"
    ? "Zu welchem Land gehört diese Flagge?"
    : "Wie heißt die Hauptstadt dieses Landes?";
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("bar").style.width = (round % 10) * 10 + "%";

  let correct = mode === "capital"
    ? current.land
    : mode === "flag"
    ? current.land
    : current.hauptstadt;

  const others = shuffle(countries.filter(c => c !== current)).slice(0, 3);
  const options = shuffle([correct, ...others.map(c =>
    mode === "country" ? c.hauptstadt : c.land
  )]);

  $("options").replaceChildren();
  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;
    button.addEventListener("click", () => choose(option, correct, button));
    $("options").appendChild(button);
  });
}

function choose(option, correct, button) {
  if (answered) return;
  answered = true;
  round++;

  const buttons = [...$("options").children];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add("correct");
  });

  if (option === correct) {
    score += 10;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    $("feedback").textContent = "🎉 Richtig! +10 Punkte";
    $("feedback").style.color = "#16834b";
  } else {
    streak = 0;
    button.classList.add("wrong");
    $("feedback").textContent = "❌ Leider falsch. Richtig ist: " + correct;
    $("feedback").style.color = "#c33737";
  }

  $("score").textContent = score;
  $("round").textContent = round;
  $("streak").textContent = streak;
  $("bar").style.width = (round % 10) * 10 + "%";
  $("next").hidden = false;
}

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    mode = button.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    newDeck();
    nextQuestion();
  });
});

$("next").addEventListener("click", nextQuestion);

$("restart").addEventListener("click", () => {
  score = 0;
  round = 0;
  streak = 0;
  $("score").textContent = "0";
  $("round").textContent = "0";
  $("streak").textContent = "0";
  newDeck();
  nextQuestion();
});

newDeck();
nextQuestion();
</script>
</body>
</html>
