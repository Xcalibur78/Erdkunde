
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europa-Quiz</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #f0f4ff;
  color: #1c2541;
}
header {
  background: linear-gradient(135deg,#3048bd,#748bff);
  color: white;
  text-align: center;
  padding: 28px 15px;
}
header h1 { margin: 0 0 8px; }
main { max-width: 650px; margin: 22px auto; padding: 0 14px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.stat, .quiz {
  background: white;
  padding: 16px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #17264d12;
}
.stat { text-align: center; }
.stat strong { display:block; font-size: 1.5rem; }
.stat span { font-size: .85rem; color: #66708a; }
.modes { display:flex; gap:8px; margin-bottom:16px; }
button {
  border: 0;
  border-radius: 11px;
  padding: 12px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.modes button { flex:1; background:#e0e7ff; color:#263da9; }
.modes button.active, .primary { background:#4059db; color:white; }
.quiz { text-align:center; padding:24px 18px; }
#category { color:#596784; font-size:.85rem; text-transform:uppercase; letter-spacing:1px; }
#question { font-size:1.5rem; margin:16px 0; }
#flag {
  display:block;
  width:180px;
  height:120px;
  object-fit:contain;
  margin:18px auto;
  border-radius:5px;
}
#flag[hidden] { display:none; }
#emoji { font-size:5rem; line-height:1.3; }
#emoji[hidden] { display:none; }
#options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}
.answer {
  background:#f0f3fc;
  color:#1c2541;
  min-height:56px;
  border:2px solid transparent;
}
.answer:hover:not(:disabled) { border-color:#4059db; }
.answer.correct { background:#d7f8e4; border-color:#24975a; }
.answer.wrong { background:#ffe0e0; border-color:#d54b4b; }
#feedback { min-height:28px; margin:18px 0; font-weight:700; }
.actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
#next { background:#4059db; color:white; }
#progress { height:8px; background:#e5e9f5; border-radius:8px; overflow:hidden; margin-top:20px; }
#bar { height:100%; background:#4059db; width:0; }
@media(max-width:420px) {
  .modes { flex-direction:column; }
  #options { grid-template-columns:1fr; }
  #question { font-size:1.25rem; }
}
</style>
</head>
<body>

<header>
  <h1>🌍 Europa-Quiz</h1>
  <div>Lerne Länder, Hauptstädte und Flaggen!</div>
</header>

<main>
  <div class="stats">
    <div class="stat"><strong id="score">0</strong><span>Punkte</span></div>
    <div class="stat"><strong id="round">0</strong><span>Fragen</span></div>
    <div class="stat"><strong id="streak">0</strong><span>Richtig in Folge</span></div>
  </div>

  <div class="modes">
    <button class="active" data-mode="capital">🏙️ Hauptstädte</button>
    <button data-mode="flag">🏳️ Flaggen</button>
    <button data-mode="country">🌍 Länder</button>
  </div>

  <section class="quiz">
    <div id="category">HAUPTSTÄDTE</div>
    <div id="question">Welche Hauptstadt hat Deutschland?</div>
    <img id="flag" alt="Flagge des Landes" hidden>
    <div id="emoji" hidden></div>

    <div id="options"></div>
    <div id="feedback" aria-live="polite"></div>

    <div class="actions">
      <button id="next" hidden>Nächste Frage →</button>
      <button id="restart">Neu starten ↻</button>
    </div>
    <div id="progress"><div id="bar"></div></div>
  </section>
</main>

<script>
const countries = [
 ["Albanien","Tirana","al"],["Andorra","Andorra la Vella","ad"],
 ["Belarus","Minsk","by"],["Belgien","Brüssel","be"],
 ["Bosnien und Herzegowina","Sarajevo","ba"],["Bulgarien","Sofia","bg"],
 ["Dänemark","Kopenhagen","dk"],["Deutschland","Berlin","de"],
 ["Estland","Tallinn","ee"],["Finnland","Helsinki","fi"],
 ["Frankreich","Paris","fr"],["Griechenland","Athen","gr"],
 ["Irland","Dublin","ie"],["Island","Reykjavík","is"],
 ["Italien","Rom","it"],["Kosovo","Pristina","xk"],
 ["Kroatien","Zagreb","hr"],["Lettland","Riga","lv"],
 ["Liechtenstein","Vaduz","li"],["Litauen","Vilnius","lt"],
 ["Luxemburg","Luxemburg","lu"],["Malta","Valletta","mt"],
 ["Moldau","Chișinău","md"],["Monaco","Monaco","mc"],
 ["Montenegro","Podgorica","me"],["Niederlande","Amsterdam","nl"],
 ["Nordmazedonien","Skopje","mk"],["Norwegen","Oslo","no"],
 ["Österreich","Wien","at"],["Polen","Warschau","pl"],
 ["Portugal","Lissabon","pt"],["Rumänien","Bukarest","ro"],
 ["Russland","Moskau","ru"],["San Marino","San Marino","sm"],
 ["Schweden","Stockholm","se"],["Schweiz","Bern","ch"],
 ["Serbien","Belgrad","rs"],["Slowakei","Bratislava","sk"],
 ["Slowenien","Ljubljana","si"],["Spanien","Madrid","es"],
 ["Tschechien","Prag","cz"],["Türkei","Ankara","tr"],
 ["Ukraine","Kyjiw (Kiew)","ua"],["Ungarn","Budapest","hu"],
 ["Vatikanstadt","Vatikanstadt","va"],
 ["Vereinigtes Königreich","London","gb"],["Zypern","Nikosia","cy"]
].map(([land, hauptstadt, code]) => ({land, hauptstadt, code}));

const $ = id => document.getElementById(id);
let mode = "capital";
let current;
let answered = false;
let score = 0, round = 0, streak = 0;
let deck = [], position = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function emojiFlag(code) {
  return code.toUpperCase().replace(/[A-Z]/g,
    c => String.fromCodePoint(127397 + c.charCodeAt(0)));
}

function newDeck() {
  deck = shuffle(countries);
  position = 0;
}

function nextQuestion() {
  if (position >= deck.length) newDeck();
  current = deck[position++];
  answered = false;

  $("feedback").textContent = "";
  $("next").hidden = true;
  $("flag").hidden = true;
  $("emoji").hidden = true;

  let correct;
  if (mode === "capital") {
    $("category").textContent = "HAUPTSTADT-RÄTSEL";
    $("question").textContent =
      "Wie heißt die Hauptstadt von " + current.land + "?";
    correct = current.hauptstadt;
  } else if (mode === "flag") {
    $("category").textContent = "FLAGGEN-RÄTSEL";
    $("question").textContent = "Zu welchem Land gehört diese Flagge?";
    correct = current.land;

    $("flag").src = "https://flagcdn.com/w320/" + current.code + ".png";
    $("flag").alt = "Flagge: " + current.land;
    $("flag").hidden = false;
    $("emoji").textContent = emojiFlag(current.code);
    $("emoji").hidden = false;

    $("flag").onload = () => { $("emoji").hidden = true; };
    $("flag").onerror = () => {
      $("flag").hidden = true;
      $("emoji").hidden = false;
    };
  } else {
    $("category").textContent = "LÄNDER-RÄTSEL";
    $("question").textContent =
      "Welches Land hat die Hauptstadt " + current.hauptstadt + "?";
    correct = current.land;
  }

  const otherCountries = shuffle(countries.filter(c => c !== current)).slice(0,3);
  const options = shuffle([
    correct,
    ...otherCountries.map(c =>
      mode === "capital" ? c.hauptstadt : c.land
    )
  ]);

  const container = $("options");
  container.replaceChildren();

  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = option;
    button.addEventListener("click", () => choose(option, correct, button));
    container.appendChild(button);
  });

  $("bar").style.width = (round % 10) * 10 + "%";
}

function choose(answer, correct, button) {
  if (answered) return;
  answered = true;
  round++;

  [...$("options").children].forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add("correct");
  });

  if (answer === correct) {
    score += 10;
    streak++;
    $("feedback").textContent = "✅ Richtig! +10 Punkte";
    $("feedback").style.color = "#16834b";
  } else {
    streak = 0;
    button.classList.add("wrong");
    $("feedback").textContent = "❌ Richtig wäre: " + correct;
    $("feedback").style.color = "#c33737";
  }

  $("score").textContent = score;
  $("round").textContent = round;
  $("streak").textContent = streak;
  $("bar").style.width = (round % 10) * 10 + "%";
  $("next").hidden = false;
}

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    mode = button.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    newDeck();
    nextQuestion();
  });
});

$("next").addEventListener("click", nextQuestion);

$("restart").addEventListener("click", () => {
  score = 0;
  round = 0;
  streak = 0;
  $("score").textContent = "0";
  $("round").textContent = "0";
  $("streak").textContent = "0";
  newDeck();
  nextQuestion();
});

newDeck();
nextQuestion();
</script>
</body>
</html>
